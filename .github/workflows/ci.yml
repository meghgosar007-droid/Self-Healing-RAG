name: ci

# PRs: smoke eval. Pushes to main + nightly: full eval. Both are gated (CONTRACT.md section 5).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: eval mode
        type: choice
        options: [smoke, full]
        default: smoke

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  checks:
    name: lint, unit tests, contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check ci tests/ci
      - name: Unit tests (offline, no API key)
        env:
          GEMINI_API_KEY: ""
        run: pytest
      - name: Reviewer-style checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m ci.checks --branch "${{ github.head_ref }}" --base "origin/${{ github.base_ref }}"
          else
            python -m ci.checks
          fi

  eval-gate:
    name: eval + gate
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Fork PRs get no secrets, so the eval cannot run there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEN_MODEL: ${{ vars.GEN_MODEL }}
      GEN_MODEL_FALLBACK: ${{ vars.GEN_MODEL_FALLBACK }}
      CRITIC_MODEL: ${{ vars.CRITIC_MODEL }}
      CRITIC_MODEL_FALLBACK: ${{ vars.CRITIC_MODEL_FALLBACK }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      JUDGE_MODEL_FALLBACK: ${{ vars.JUDGE_MODEL_FALLBACK }}
      EVAL_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke')) && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Rebuild index from committed chunks
        run: python -m src.ingestion.ingest --rebuild-index
      - name: Validate GEMINI_API_KEY is plain ASCII (never prints it)
        run: |
          python - <<'PY'
          import os, sys
          k = os.environ.get("GEMINI_API_KEY", "")
          if not k or not (k.isascii() and k.isprintable() and k == k.strip()):
              sys.exit("GEMINI_API_KEY secret is missing or malformed (BOM / whitespace / non-ASCII); re-set it")
          PY
      - name: Run eval (${{ env.EVAL_MODE }})
        run: python -m eval.runner --mode "$EVAL_MODE" --run-id "ci-$EVAL_MODE-$GITHUB_RUN_ID"
      - name: Gate
        id: gate
        run: |
          python -m ci.gate --result "eval/results/ci-$EVAL_MODE-$GITHUB_RUN_ID.json" \
            --expected-mode "$EVAL_MODE" --markdown gate-summary.md
      - name: Job summary
        if: always() && hashFiles('gate-summary.md') != ''
        run: cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('gate-summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gate-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const prev = comments.find(c => c.body.startsWith('<!-- eval-gate -->'));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload eval result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-result-${{ env.EVAL_MODE }}
          path: |
            eval/results/ci-*.json
            gate-summary.md
          if-no-files-found: ignore
