[project]
name = "self-healing-rag"
version = "0.1.0"
description = "Self-healing RAG over the DeepSeek-R1, DeepSeekMath and Dr. GRPO papers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langgraph>=1.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
